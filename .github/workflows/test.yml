name: test
on: [push, pull_request]
env:
  CI: true
permissions:
  contents: read
jobs:
  check:
    name: Check, unit test and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@68f39c78aaf39be468cabd2afb09c162574c84af # v1.21.2
        with:
          node-version-file: .node-version
          cache: true
      - name: Install
        run: vp install --frozen-lockfile
      - name: Format, lint and type check
        run: vp check
      - name: Unit tests
        run: vp test
      - name: Build
        run: vp build
  playwright-version:
    name: Playwright version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          sparse-checkout: pnpm-workspace.yaml
          sparse-checkout-cone-mode: false
      - name: Read @playwright/test from the pnpm catalog
        id: version
        run: |
          version="$(yq -r '.catalog."@playwright/test"' pnpm-workspace.yaml)"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error file=pnpm-workspace.yaml::@playwright/test must be an exact version for the Docker image, got '$version'"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
  e2e:
    name: Integration tests
    needs: playwright-version
    runs-on: ubuntu-latest
    # Browsers and their system dependencies come with the image: no `playwright install` per run.
    # https://playwright.dev/docs/docker
    container:
      image: mcr.microsoft.com/playwright:v${{ needs.playwright-version.outputs.version }}-noble
      options: --init --ipc=host --user=1001
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@68f39c78aaf39be468cabd2afb09c162574c84af # v1.21.2
        with:
          node-version-file: .node-version
          cache: true
      - name: Install
        run: vp install --frozen-lockfile
      - name: Integration tests against the fake Inoreader and GitHub APIs
        run: vp run test:e2e
      - name: Upload report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
